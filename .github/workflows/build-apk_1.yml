name: Build Quadcopter PID APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Locate Project Root & Compile Debug APK
        run: |
          echo "=== Checking uploaded repository structure ==="
          find . -maxdepth 4 -not -path '*/.*'

          # Find where settings.gradle.kts is located (in case files are inside a subfolder)
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not uploaded to GitHub!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Android project root at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Verify that the app/ folder and app/build.gradle.kts exist
          if [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts is missing! Make sure the 'app' folder was uploaded."
            exit 1
          fi

          # Accept Android SDK licenses and build the APK directly with Gradle 8.7
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 5. Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Quadcopter-Cascade-PID-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
