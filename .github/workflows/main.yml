- name: 4. Auto-Organize Flat Files & Compile Debug APK
        run: |
          echo "=== Organizing flat files into Android project structure ==="
          mkdir -p app/src/main/java/com/banumusateam/digitalpid
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # Move Kotlin files
          for ktfile in CascadeAxisController.kt UsbSerialController.kt QuadcopterFlightController.kt MainActivity.kt; do
            if [ -f "$ktfile" ]; then
              mv "$ktfile" app/src/main/java/com/banumusateam/digitalpid/
            fi
          done

          # Move AndroidManifest.xml
          if [ -f "AndroidManifest.xml" ]; then
            mv "AndroidManifest.xml" app/src/main/AndroidManifest.xml
          fi

          # BULLETPROOF ICON HANDLER
          if [ -f "icon.png" ]; then
            mv "icon.png" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "✅ Found icon.png and moved it to resources!"
          elif [ -f "Icon.png" ]; then
            mv "Icon.png" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "✅ Found Icon.png and moved it to resources!"
          else
            echo "⚠️ WARNING: No icon.png found!"
            echo "Removing icon requirement from AndroidManifest.xml so the build won't crash..."
            sed -i 's/android:icon="@mipmap\/ic_launcher"//g' app/src/main/AndroidManifest.xml
          fi

          # Create settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "DigitalPID"
          include(":app")
          EOF

          # Create Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # Create App-level app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.banumusateam.digitalpid"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.banumusateam.digitalpid"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.github.mik3y:usb-serial-for-android:3.8.0")
          }
          EOF

          # Accept Android SDK licenses and compile the APK
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          gradle :app:assembleDebug --no-daemon --stacktrace
